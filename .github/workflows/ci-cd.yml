name: CI/CD Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: visita_lajas_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
    - uses: actions/checkout@v5
    
    - name: Setup Node.js
      uses: actions/setup-node@v5
      with:
        node-version: '22'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci

    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
        
    - name: Run Linter
      run: npm run lint || true
    
    - name: Run Unit Tests
      run: npm run test:unit
    
    - name: Run Integration Tests
      run: npm run test:integration
      env:
        DATABASE_URL: postgres://postgres:postgres@localhost:5432/test_db
      
    - name: Debug env
      run: |
        echo "DATABASE_URL=$DATABASE_URL"
        echo "POSTGRES_URL=$POSTGRES_URL"
      env:
        DATABASE_URL: postgres://postgres:postgres@localhost:5432/visita_lajas_db
    - name: List databases
      run: |
        PGPASSWORD=postgres psql -h localhost -U postgres -l
    
    - name: Run E2E Tests
      run: npm run test:e2e
      env:
        DATABASE_URL: postgres://postgres:postgres@localhost:5432/visita_lajas_db
    
    - name: Generate Coverage Report
      run: npm test -- --coverage
    
    - name: Upload Coverage to Codecov
      uses: codecov/codecov-action@v5
      with:
        file: ./coverage/coverage-final.json
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

  deploy-to-production:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && github.event_name == 'push'
    
    steps:
    - uses: actions/checkout@v5
    
    - name: Setup Node.js
      uses: actions/setup-node@v5
      with:
        node-version: '22'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Build application
      run: npm run build || echo "No build script"
    
    - name: Deploy to Render
      env:
        RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
      if: ${{ env.RENDER_DEPLOY_HOOK != '' }}
      run: |
        curl "$RENDER_DEPLOY_HOOK" \
          -H "Content-Type: application/json" \
          -d '{"commit_sha":"'${{ github.sha }}'"}' || true
    
    - name: Deploy to Railway
      env:
        RAILWAY_DEPLOY_TOKEN: ${{ secrets.RAILWAY_DEPLOY_TOKEN }}
      if: ${{ env.RAILWAY_DEPLOY_TOKEN != '' }}
      run: |
        echo "Deploying to Railway..."
        echo "Deployment triggered on main branch"
        # Add Railway deployment command here if needed
